<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1620" height="900" fill="#F6F8F7"/>
  <text x="810" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B4A40">Pharmacy Inventory Management System — ER Diagram</text>

  <!-- Entity macro style -->
  <defs>
    <style>
      .ent { fill: #FFFFFF; stroke: #0F6B5C; stroke-width: 1.5; }
      .hdr { fill: #0F6B5C; }
      .hdrtext { fill: #FFFFFF; font-weight: bold; font-size: 13px; }
      .field { font-size: 11.5px; fill: #1B2B28; }
      .pk { font-weight: bold; fill: #0B4A40; }
      .fk { fill: #D4901F; }
      .rel { stroke: #6B7C77; stroke-width: 1.3; fill: none; }
      .reltext { font-size: 10px; fill: #6B7C77; }
    </style>
  </defs>

  <!-- USERS -->
  <g transform="translate(40,70)">
    <rect class="ent" width="190" height="150" rx="6"/>
    <rect class="hdr" width="190" height="26" rx="6"/>
    <text x="95" y="18" text-anchor="middle" class="hdrtext">users</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field">full_name</text>
    <text x="10" y="78" class="field">username (UQ)</text>
    <text x="10" y="96" class="field">password</text>
    <text x="10" y="114" class="field">role</text>
    <text x="10" y="132" class="field">status</text>
  </g>

  <!-- PRODUCTS -->
  <g transform="translate(320,70)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">products</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field">medicine_name</text>
    <text x="10" y="78" class="field">selling_price</text>
    <text x="10" y="96" class="field">current_stock</text>
    <text x="10" y="114" class="field">description</text>
    <text x="10" y="132" class="field">status</text>
  </g>

  <!-- BOXES -->
  <g transform="translate(580,70)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">boxes</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field">box_name</text>
    <text x="10" y="78" class="field">current_quantity</text>
    <text x="10" y="96" class="field">description</text>
    <text x="10" y="114" class="field">status</text>
  </g>

  <!-- STOCK_IN -->
  <g transform="translate(320,280)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">stock_in</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field fk">FK product_id</text>
    <text x="10" y="78" class="field">quantity</text>
    <text x="10" y="96" class="field">remark</text>
    <text x="10" y="114" class="field">transaction_date</text>
    <text x="10" y="132" class="field fk">FK user_id</text>
  </g>

  <!-- STOCK_OUT -->
  <g transform="translate(40,280)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">stock_out</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field fk">FK product_id</text>
    <text x="10" y="78" class="field">quantity</text>
    <text x="10" y="96" class="field">reason</text>
    <text x="10" y="114" class="field">transaction_date</text>
    <text x="10" y="132" class="field fk">FK user_id</text>
  </g>

  <!-- BOX_IN -->
  <g transform="translate(580,280)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">box_in</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field fk">FK box_id</text>
    <text x="10" y="78" class="field">quantity</text>
    <text x="10" y="96" class="field">remark</text>
    <text x="10" y="114" class="field">transaction_date</text>
    <text x="10" y="132" class="field fk">FK user_id</text>
  </g>

  <!-- BOX_OUT -->
  <g transform="translate(820,280)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">box_out</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field fk">FK box_id</text>
    <text x="10" y="78" class="field">quantity</text>
    <text x="10" y="96" class="field">reason</text>
    <text x="10" y="114" class="field">transaction_date</text>
    <text x="10" y="132" class="field fk">FK user_id</text>
  </g>

  <!-- SALES -->
  <g transform="translate(320,490)">
    <rect class="ent" width="220" height="190" rx="6"/>
    <rect class="hdr" width="220" height="26" rx="6"/>
    <text x="110" y="18" text-anchor="middle" class="hdrtext">sales</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field">customer_name</text>
    <text x="10" y="78" class="field fk">FK product_id</text>
    <text x="10" y="96" class="field">quantity</text>
    <text x="10" y="114" class="field">selling_price</text>
    <text x="10" y="132" class="field">total_amount</text>
    <text x="10" y="150" class="field">amount_paid / remaining_balance</text>
    <text x="10" y="168" class="field">payment_status / sale_date</text>
  </g>

  <!-- PAYMENTS -->
  <g transform="translate(600,490)">
    <rect class="ent" width="200" height="150" rx="6"/>
    <rect class="hdr" width="200" height="26" rx="6"/>
    <text x="100" y="18" text-anchor="middle" class="hdrtext">payments</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field fk">FK sale_id</text>
    <text x="10" y="78" class="field">amount</text>
    <text x="10" y="96" class="field">payment_date</text>
    <text x="10" y="114" class="field fk">FK user_id</text>
  </g>

  <!-- EXPENSES -->
  <g transform="translate(870,490)">
    <rect class="ent" width="210" height="170" rx="6"/>
    <rect class="hdr" width="210" height="26" rx="6"/>
    <text x="105" y="18" text-anchor="middle" class="hdrtext">expenses</text>
    <text x="10" y="42" class="field pk">PK id</text>
    <text x="10" y="60" class="field">title</text>
    <text x="10" y="78" class="field">category</text>
    <text x="10" y="96" class="field">amount</text>
    <text x="10" y="114" class="field">expense_date</text>
    <text x="10" y="132" class="field">notes</text>
    <text x="10" y="150" class="field fk">FK user_id</text>
  </g>

  <!-- Relationships -->
  <!-- products -> stock_in -->
  <path class="rel" d="M420,220 L420,280"/>
  <text x="425" y="255" class="reltext">1:N</text>
  <!-- products -> stock_out -->
  <path class="rel" d="M380,220 C300,250 200,255 140,280"/>
  <text x="220" y="250" class="reltext">1:N</text>
  <!-- boxes -> box_in -->
  <path class="rel" d="M680,220 L680,280"/>
  <text x="685" y="255" class="reltext">1:N</text>
  <!-- boxes -> box_out -->
  <path class="rel" d="M720,220 C800,250 870,255 920,280"/>
  <text x="800" y="250" class="reltext">1:N</text>
  <!-- products -> sales -->
  <path class="rel" d="M420,220 C420,330 430,420 430,490"/>
  <text x="435" y="400" class="reltext">1:N</text>
  <!-- sales -> payments -->
  <path class="rel" d="M540,565 L600,565"/>
  <text x="555" y="558" class="reltext">1:N</text>
  <!-- users -> stock_in/out/box_in/out/sales/payments (dashed, summarized) -->
  <path class="rel" stroke-dasharray="4,3" d="M135,220 C135,400 200,500 320,560"/>
  <text x="150" y="400" class="reltext">users record all transactions (1:N)</text>

  <!-- users -> expenses (dashed) -->
  <path class="rel" stroke-dasharray="4,3" d="M135,220 C200,420 600,540 870,560"/>

  <text x="810" y="870" text-anchor="middle" font-size="11" fill="#6B7C77">All foreign keys enforce referential integrity. Schema normalized to 3NF — no repeating groups, no partial/transitive dependencies.</text>
</svg>
